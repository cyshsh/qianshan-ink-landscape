:root { --ink: #1f1d1a; --soft: rgba(31, 29, 26, .52); --hair: rgba(31, 29, 26, .22); --red: #b4261b; --paper: #eee7d5; }
body.night { --ink: #eadfb8; --soft: rgba(234, 223, 184, .56); --hair: rgba(234, 223, 184, .24); --paper: #0f1622; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e2cf; }
body { font-family: "Qianshan Serif", "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; opacity: 0; transition: opacity .8s ease; }
body.ready #c { opacity: 1; }
body.dragging #c { cursor: grabbing; }

#ui { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; user-select: none; -webkit-user-select: none; }
body.ready #ui { opacity: 1; transition-delay: 1.2s; }
body.idle #ui { opacity: 0; transition: opacity 2.4s ease; }
body.bare #ui { opacity: 0 !important; }
#ui > * { position: absolute; bottom: clamp(18px, 3.6vh, 36px); }

.brand { left: clamp(20px, 3.2vw, 44px); display: flex; align-items: baseline; gap: 14px; margin: 0; }
.brand h1 { font: 400 30px/1 "Ma Shan Zheng", "Kaiti SC", "STKaiti", serif; margin: 0; letter-spacing: .08em; }
.brand p { margin: 0; font-size: 12px; letter-spacing: .28em; color: var(--soft); display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand p i { width: 3px; height: 3px; border-radius: 50%; background: var(--red); }

.bar { left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; pointer-events: auto; }
.bar button { appearance: none; border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer; padding: 0; transition: color .25s, background .25s, opacity .25s; }
.bar [data-season] { width: 34px; height: 34px; font-size: 15px; line-height: 34px; border-radius: 3px; opacity: .62; }
.bar [data-season]:hover { opacity: 1; }
.bar [data-season].on { background: var(--red); color: #f4ecd9; opacity: 1; box-shadow: inset 0 0 0 1.5px rgba(244, 236, 217, .0), 0 0 0 .5px rgba(120, 20, 12, .35); }
.bar .rule { width: 1px; height: 16px; background: var(--hair); margin: 0 14px; }
.bar .act { font-size: 13px; letter-spacing: .32em; padding: 9px 4px 9px 10px; opacity: .72; position: relative; }
.bar .act + .act { margin-left: 10px; }
.bar .act::after { content: ""; position: absolute; left: 10px; right: calc(4px + .32em); bottom: 5px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .35s ease; }
.bar .act:hover { opacity: 1; }
.bar .act:hover::after { transform: scaleX(1); }
.bar button:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

#hint { right: clamp(20px, 3.2vw, 44px); margin: 0; font-size: 12px; letter-spacing: .26em; color: var(--soft); transition: opacity 1.6s ease; white-space: nowrap; line-height: 34px; }
#hint.gone { opacity: 0; }
#nogl { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; letter-spacing: .3em; }
body.nogl #nogl { display: flex; }

@media (max-width: 820px) {
  #hint { display: none; }
  .brand { bottom: auto !important; top: 18px; }
  .bar .rule { margin: 0 8px; }
}
@media (prefers-reduced-motion: reduce) { #c, #ui { transition: none; } }

<script type="x-shader/x-fragment" id="frag">
precision highp float;

uniform vec2 uRes;
uniform float uTime, uSeed, uScroll, uReveal;
uniform vec2 uMouse;
uniform vec3 uPaper, uMist, uSky, uInkFar, uInkNear, uTintA, uTintB, uSunCol, uWaterCol;
uniform vec4 uSun;    // x, y, radius, halo
uniform vec4 uStyle;  // steepness, tintA amount, tintB amount, texture amount
uniform vec4 uMode;   // snow, night, water level, birds
uniform sampler2D uOverlay;
uniform vec4 uTextRect, uSealRect;
uniform vec3 uOvIn;   // plant, text, seal
uniform vec2 uOvOrigin;

const int NL = 6;

float h11(float p){ p = fract(p*.1031); p *= p+33.33; p *= p+p; return fract(p); }
float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float n1(float x){ float i=floor(x), f=fract(x); f=f*f*(3.-2.*f); return mix(h11(i),h11(i+1.),f); }
float n2(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x), mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x), f.y);
}
float fbm2(vec2 p){ float a=.5, s=0.; for(int i=0;i<4;i++){ s+=a*n2(p); p=p*2.03+vec2(17.1,9.2); a*=.5; } return s/.9375; }
float fbm3(vec2 p){ float a=.5, s=0.; for(int i=0;i<3;i++){ s+=a*n2(p); p=p*2.03+vec2(17.1,9.2); a*=.5; } return s/.875; }

// silhouette of one mountain layer, roughly 0..1
float rdg(float v){ v = 2.*v-1.; return 1.-sqrt(v*v+.006); }
float ridge(float x, float li){
  float t = li/float(NL-1);
  float X = x*mix(.85, 1.6, t) + uSeed + li*57.31;
  X += .30*(n1(X*1.7+3.1)-.5) + .05*(n1(X*6.1+1.3)-.5);
  float big = pow(max(rdg(n1(X)), 0.), uStyle.x);
  float mid = rdg(n1(X*2.63+11.3));
  float crag = rdg(n1(X*6.3+4.7));
  float sm = n1(X*5.1+5.1);
  float ti = n1(X*17.+2.7);
  float mi = n1(X*41.+7.9);
  return big*.62 + mid*mid*.25*(.3+big) + crag*.11*(.25+big) + sm*.05 + ti*.03 + mi*.011*t - .09;
}

// conifer tips riding on the ridge of near layers
float spire(float x, float F, float sd){
  float c = floor(x*F), f = fract(x*F);
  float r = h11(c*1.31 + sd);
  float hgt = max(0., r-.3)/.7;
  float w = mix(.20, .38, h11(c*3.3 + sd*2.));
  float off = (h11(c*2.7 + sd)-.5)*.34;
  return (.3+.7*hgt*hgt)*step(.3, r)*pow(max(0., 1.-abs(f-.5-off)/w), 1.35);
}
float trees(float x, float li){
  float m = smoothstep(.36,.62, n1(x*2.3 + li*7.7 + uSeed*.7));
  return max(spire(x, 46., li*31.7), spire(x, 97., li*11.3)*.55)*m;
}

vec3 scene(vec2 p, float aa){
  float wl = uMode.z;
  // ---------- sky wash
  float skyN = fbm3(vec2(p.x*1.1 + uScroll*.04 + uSeed, p.y*2.2 + uTime*.003));
  float skyAmt = smoothstep(.30, 1.10, p.y + (skyN-.5)*.45);
  vec3 col = mix(uMist, uSky, skyAmt);

  // ---------- stars (night)
  if (uMode.y > .5) {
    vec2 sg = p*90. + vec2(uScroll*1.2, 0.);
    vec2 sc = floor(sg);
    vec2 sr = h22(sc);
    float sdist = length(fract(sg)-.15-.7*sr);
    float tw = .6+.4*sin(uTime*(1.+2.*sr.x)+sr.y*40.);
    float star = step(.93, h21(sc+3.7))*smoothstep(.09,.0,sdist)*tw;
    col += vec3(.95,.92,.8)*star*.7*smoothstep(.35,.8,p.y)*uReveal;
  }

  // ---------- sun / moon
  vec2 sp = p - vec2(uSun.x - uScroll*.015, uSun.y);
  float sd = length(sp) + (fbm3(p*26.)-.5)*.0035;
  float disc = smoothstep(uSun.z, uSun.z - 2.*aa - .0025, sd);
  float sunIn = smoothstep(0., .22, uReveal);
  col = mix(col, uSunCol, uSun.w*exp(-max(sd-uSun.z,0.)/(uSun.z*2.4))*sunIn);
  col = mix(col, uSunCol*(.93+.07*n2(p*240.)), disc*sunIn*mix(.92,1.,uMode.y));

  // ---------- mountains, far to near
  for (int i=0; i<NL; i++) {
    float li = float(i), t = li/float(NL-1);
    float par = mix(.10, 1., t*t);
    float x = p.x + uScroll*par + uMouse.x*par*.035;
    float y = p.y + uMouse.y*par*.014;
    float en = n1(x*.46 + uSeed*1.7 + li*4.13);
    float env = mix(.45 + .75*en, .22 + 1.3*pow(en, 1.2), smoothstep(0., .5, t));
    float base = mix(.47, -.05, pow(t,.85)) + wl*mix(.5, 1., t);
    float amp = mix(.36, .23, t)*env;
    if (y > base + amp + .06) continue;
    float e = .003;
    float h0 = ridge(x, li), h1 = ridge(x+e, li);
    float slope = (h1-h0)/e*amp;
    float H = base + amp*h0;
    if (i >= 3) H += trees(x, li)*.030*mix(.55,1.,t);
    float rag = (n2(vec2(x,y)*mix(50.,170.,t)+li*17.)-.5)*mix(.014,.0035,t);
    float d = H - y + rag;
    float soft = mix(.014, 1.6*aa, smoothstep(0.,.5,t));
    float cov = smoothstep(0., soft, d);

    float lp = clamp((uReveal - .12 - t*.48)/.38, 0., 1.);
    float rv = 1.;
    if (uReveal < .999) rv = smoothstep(0., 1., lp*1.6 - .6*fbm3(vec2(x*5.,y*5.)+li*3.1));

    if (cov > 0.) {

float boat(vec2 q, float aq){

  a = max(a, smoothstep(1.+aq*4., 1.-aq*4., length(c))*step(-.02,q.y)*.9);
  vec2 f = (q-vec2(.52,.11))/vec2(.055,.13);
  a = max(a, smoothstep(1.+aq*8., 1.-aq*8., length(f)));
  vec2 hh = (q-vec2(.52,.25))/vec2(.125,.04);
  a = max(a, smoothstep(1.+aq*10., 1.-aq*10., length(hh)));

}

  for (let k = 0; k < nb; k++) {
    const o = nb === 1 ? 0 : (k + .5) / nb - .5 + (R() - .5) * .4 / nb;
    const edge = Math.abs(o) * 2;
    const th = dry * (.45 + 1.25 * edge * edge);
    const ph = R() * 1000, fr = .05 + .06 * R();
    ctx.globalAlpha = alpha * (.6 + .4 * R()) * (1 - .2 * edge);
    let run = [];
    const flush = () => {
      if (run.length > 1) {
        ctx.beginPath();
        for (let m = 0; m < run.length; m++) {
          const i = run[m], x = pts[i][0] + nx[i] * (o - hw) * ws[i], y = pts[i][1] + ny[i] * (o - hw) * ws[i];
          m ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        for (let m = run.length - 1; m >= 0; m--) {
          const i = run[m];
          ctx.lineTo(pts[i][0] + nx[i] * (o + hw) * ws[i], pts[i][1] + ny[i] * (o + hw) * ws[i]);
        }
        ctx.closePath(); ctx.fill();
      }
      run = [];
    };
    for (let i = 0; i < n; i++) {
      if (nb > 1 && vnoise(ph + i * fr) < th) flush(); else run.push(i);
    }
    flush();
  }
  ctx.globalAlpha = 1;
}

function lens(ctx, x, y, a, len, wid, bend = 0) {
  const c = Math.cos(a), s = Math.sin(a), tx = x + c * len, ty = y + s * len;
  const mx = x + c * len * .42, my = y + s * len * .42;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(mx - s * (wid + bend), my + c * (wid + bend), tx, ty);
  ctx.quadraticCurveTo(mx + s * (wid - bend), my - c * (wid - bend), x, y);
  ctx.fill();
}

/* ---------------------------------------------------------------- plants */

const PLANTS = {
  // \u6885 \u2014 angular boughs, red blossoms
  plum(g) {
    const { ctx, H, u, R, ink } = g, flowers = [];
    const grow = (x, y, a, len, w, depth) => {
      const pts = walk(R, x, y, a, len, { curl: (R() - .5) * 1.0, jit: .085, step: 2.5 * u });
      const n = pts.length, w1 = w * (depth > 1 ? .4 : .58);
      brush(ctx, pts, t => w + (w1 - w) * t, ink, .94, .14 + .05 * depth, R);
      if (w < 6 * u) {
        const cnt = Math.round(len / (30 * u) * (.5 + R()));
        for (let i = 0; i < cnt; i++) {
          const p = pts[Math.floor((.1 + .9 * R()) * (n - 1))];
          flowers.push([p[0] + (R() - .5) * 9 * u, p[1] + (R() - .5) * 9 * u, R(), R()]);
        }
      }
      if (depth >= 5 || len < 36 * u) return;
      const kids = depth === 0 ? 3 : (R() < .6 ? 2 : 1);
      for (let k = 0; k < kids; k++) {
        const ti = Math.floor((.25 + .65 * R()) * (n - 1)), side = R() < .5 ? -1 : 1;
        grow(pts[ti][0], pts[ti][1], tangent(pts, ti) + side * (.5 + R() * .7), len * (.45 + R() * .3), w * (.4 + R() * .2), depth + 1);
      }
      grow(pts[n - 1][0], pts[n - 1][1], pts.endAngle + (R() - .5) * 1.2, len * (.58 + R() * .2), w1, depth + 1);
    };
    grow(-24 * u, H * (.07 + R() * .08), .42 + R() * .3, 250 * u, 21 * u, 0);
    const reds = ['#C12F29', '#D1433A', '#AE2222', '#D85A4C'];
    for (const [x, y, r1, r2] of flowers) {
      const r = (5 + 3.2 * r1) * u, col = reds[Math.floor(r2 * reds.length)];
      ctx.fillStyle = col;
      if (r2 < .3) {            // bud
        ctx.globalAlpha = .88;
        ctx.beginPath(); ctx.arc(x, y, r * .5, 0, 7); ctx.fill();
        continue;
      }
      const rot = r1 * 6.28, open = .55 + .1 * r2;
      ctx.globalAlpha = .8;
      for (let p = 0; p < 5; p++) {
        const a = rot + p * 1.2566;
        ctx.beginPath(); ctx.arc(x + Math.cos(a) * r * open, y + Math.sin(a) * r * open, r * .56, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = .9; ctx.fillStyle = '#F2D48A';
      for (let p = 0; p < 6; p++) {
        const a = rot + p * 1.05 + .3;
        ctx.beginPath(); ctx.arc(x + Math.cos(a) * r * .28, y + Math.sin(a) * r * .28, Math.max(.6, r * .09), 0, 7); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  },

  // \u67F3 \u2014 a bough along the top edge, long strands falling
  willow(g) {
    const { ctx, H, u, R, ink } = g;
    const greens = ['#6E9A49', '#8AAE58', '#5B8950', '#9DBB62', '#4F7B4A'];
    const wind = .25 + R() * .35;
    const boughs = [walk(R, -24 * u, H * (.015 + .05 * R()), .10 + R() * .12, 560 * u, { curl: .22, jit: .05, step: 3 * u })];
    const b0 = boughs[0];
    for (let k = 0; k < 2; k++) {
      const ti = Math.floor((.15 + .4 * R()) * (b0.length - 1));
      boughs.push(walk(R, b0[ti][0], b0[ti][1], tangent(b0, ti) + .35 + R() * .4, (200 + R() * 140) * u, { curl: -.3, jit: .06, step: 3 * u }));
    }
    const strands = [];
    boughs.forEach((b, bi) => {
      const cnt = bi ? 6 + Math.floor(R() * 4) : 15 + Math.floor(R() * 7);
      for (let i = 0; i < cnt; i++) {
        const ti = Math.floor((.06 + .92 * (i + R()) / cnt) * (b.length - 1));
        strands.push([b[ti][0], b[ti][1], tangent(b, ti)]);
      }
    });
    for (const [x, y, ta] of strands) {
      const len = (190 + R() * 300) * u;
      const pts = walk(R, x, y, ta + .5 + R() * .5, len, { pull: Math.PI / 2 - wind * .4, grav: .05, curl: -wind * (.4 + R() * .5), jit: .035, step: 2.5 * u });
      brush(ctx, pts, t => (1.9 - 1.2 * t) * u, '#4C6A3B', .72, 0, R);
      let side = 1;
      for (let i = 6; i < pts.length; i += 3 + Math.floor(R() * 3)) {
        side = -side;
        const a = tangent(pts, i) + side * (.35 + R() * .4), L = (10 + R() * 9) * u;
        ctx.fillStyle = greens[Math.floor(R() * greens.length)];
        ctx.globalAlpha = .5 + R() * .38;
        lens(ctx, pts[i][0], pts[i][1], a, L, L * .32, side * L * .06);
      }
    }
    ctx.globalAlpha = 1;
    boughs.forEach((b, bi) => brush(ctx, b, t => (bi ? 7 : 16) * u * (1 - .8 * t) + 1.6 * u, ink, .92, .2, R));
  },

  // \u677E \u2014 a heavy bough from the side, needles in fans
  pine(g) {
    const { ctx, H, u, R, ink } = g, fans = [];
    const bough = (x, y, a, len, w, depth) => {
      const pts = walk(R, x, y, a, len, { curl: (R() - .5) * .7 - .12, jit: .13, step: 2.5 * u });
      const n = pts.length;
      const cnt = Math.max(2, Math.round(len / (30 * u)));
      for (let i = 0; i < cnt; i++) {
        const ti = Math.floor(clamp((i + .5 + R() * .5) / cnt, 0, 1) * (n - 1));
        if (depth === 0 && ti < n * .25) continue;
        fans.push([pts[ti][0] + (R() - .5) * 10 * u, pts[ti][1] - R() * 6 * u, R()]);
      }
      fans.push([pts[n - 1][0], pts[n - 1][1], R()]);
      if (depth < 3) {
        const kids = depth === 0 ? 3 : 1 + (R() < .5);
        for (let k = 0; k < kids; k++) {
          const ti = Math.floor((.3 + .6 * R()) * (n - 1)), side = R() < .3 ? 1 : -1;
          bough(pts[ti][0], pts[ti][1], tangent(pts, ti) + side * (.45 + R() * .55), len * (side > 0 ? .3 : .42 + R() * .25), w * .5, depth + 1);
        }
      }
      brush(ctx, pts, t => w * (1 - .7 * t) + 1.2 * u, ink, .95, .2 + .04 * depth, R);
    };
    bough(-24 * u, H * (.13 + R() * .1), .12 + R() * .22, 400 * u, 23 * u, 0);
    ctx.lineCap = 'round';
    for (const [x, y, r] of fans) {
      const L = (27 + r * 17) * u, nn = 17 + Math.floor(r * 9);
      const tilt = (R() - .5) * .5;
      for (let i = 0; i < nn; i++) {
        const a = Math.PI + .12 + (Math.PI - .24) * (i + R() * .6) / nn + tilt;
        const l = L * (.75 + .25 * R());
        ctx.strokeStyle = R() < .3 ? '#52655A' : '#1D2A24';
        ctx.globalAlpha = .45 + R() * .45;
        ctx.lineWidth = (.9 + R() * .6) * u;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + Math.cos(a) * l * .5, y + Math.sin(a) * l * .5 - 1.5 * u, x + Math.cos(a) * l, y + Math.sin(a) * l);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  },

  // \u67AB \u2014 slender branches, leaves in vermilion and ochre
  maple(g) {
    const { ctx, W, H, u, R, ink } = g, leaves = [];
    const cols = ['#B8321E', '#D05A22', '#C9812E', '#8E2415', '#C5441F', '#DB7B2B'];
    const leaf = (x, y, a, L, c, al) => {
      ctx.fillStyle = c; ctx.globalAlpha = al;
      const da = [-1.25, -.62, 0, .62, 1.25], f = [.55, .85, 1, .85, .55];
      for (let i = 0; i < 5; i++) lens(ctx, x, y, a + da[i], L * f[i], L * f[i] * .36);
    };
    const grow = (x, y, a, len, w, depth) => {
      const pts = walk(R, x, y, a, len, { curl: (R() - .5) * .6, jit: .06, step: 2.5 * u });
      const n = pts.length, w1 = w * .5;
      brush(ctx, pts, t => w + (w1 - w) * t, ink, .92, .15 + .05 * depth, R);
      if (depth >= 2) {
        const cnt = Math.round(len / (17 * u) * (.5 + R() * .8));
        for (let i = 0; i < cnt; i++) {
          const p = pts[Math.floor((.2 + .8 * R()) * (n - 1))];
          leaves.push([p[0] + (R() - .5) * 26 * u, p[1] + (R() - .3) * 26 * u, R() * 6.28, (12 + R() * 11) * u, cols[Math.floor(R() * cols.length)], .62 + R() * .3]);
        }
      }
      if (depth >= 5 || len < 34 * u) return;
      const kids = depth === 0 ? 3 : (R() < .55 ? 2 : 1);
      for (let k = 0; k < kids; k++) {
        const ti = Math.floor((.25 + .65 * R()) * (n - 1)), side = R() < .5 ? -1 : 1;
        grow(pts[ti][0], pts[ti][1], tangent(pts, ti) + side * (.4 + R() * .6), len * (.45 + R() * .3), w * (.42 + R() * .2), depth + 1);
      }
      grow(pts[n - 1][0], pts[n - 1][1], pts.endAngle + (R() - .5) * .8, len * (.6 + R() * .2), w1, depth + 1);
    };
    grow(-24 * u, H * (.05 + R() * .07), .36 + R() * .28, 250 * u, 15 * u, 0);
    for (const l of leaves) leaf(...l);
    // a few leaves let go
    for (let i = 0; i < 5; i++) leaf(W * (.06 + R() * .3), H * (.3 + R() * .45), R() * 6.28, (9 + R() * 7) * u, cols[Math.floor(R() * cols.length)], .5 + R() * .3);
    ctx.globalAlpha = 1;
  },

  // \u7AF9 \u2014 stalks rising from the foot of the picture
  bamboo(g) {
    const { ctx, W, H, u, R, ink } = g;
    const nst = 2 + (R() < .6 ? 1 : 0), tips = [];
    for (let s = nst - 1; s >= 0; s--) {
      const far = s === nst - 1 && nst > 2;
      const col = far ? '#18222F' : ink, al = far ? .75 : .95;
      let x = W * .03 + (50 + s * 70 + R() * 30) * u, y = H + 30 * u;
      let a = -Math.PI / 2 + .05 + R() * .1;
      const w = (12 - s * 2.2 + R() * 2.5) * u, top = H * (.10 + R() * .16);
      let seg = 0;
      while (y > top) {
        const len = (100 + R() * 45) * u * (1 - seg * .03);
        const pts = walk(R, x, y, a, len, { jit: .004, step: 3 * u });
        const ww = w * (1 - seg * .07);
        brush(ctx, pts, t => ww * (1 + .16 * Math.pow(Math.abs(2 * t - 1), 4)), col, al, .1, R);
        const e = pts[pts.length - 1];
        a += (R() - .5) * .03 + .012;
        x = e[0] + Math.cos(a) * 3.5 * u; y = e[1] + Math.sin(a) * 3.5 * u;
        seg++;
        if (seg > 1 && R() < .8) {
          const side = R() < .7 ? 1 : -1;
          const tw = walk(R, e[0], e[1], a + side * (.55 + R() * .5), (60 + R() * 90) * u, { curl: side * .3, jit: .03, step: 3 * u });
          brush(ctx, tw, t => (2.2 - 1.2 * t) * u, col, al, 0, R);
          tips.push([tw[tw.length - 1], col, al, side]);
          if (R() < .6) tips.push([tw[Math.floor(tw.length * .55)], col, al, side]);
        }
      }
      tips.push([[x, y], col, al, 1]);
    }
    for (const [p, col, al, side] of tips) {
      const n = 3 + Math.floor(R() * 3), base = Math.PI / 2 - side * (.25 + R() * .5);
      ctx.fillStyle = col;
      for (let i = 0; i < n; i++) {
        const a = base + (i - (n - 1) / 2) * (.38 + R() * .12) + (R() - .5) * .15;
        const L = (58 + R() * 52) * u * (i === Math.floor(n / 2) ? 1.15 : 1);
        ctx.globalAlpha = al * (.82 + R() * .18);
        lens(ctx, p[0], p[1], a, L, L * .16, (R() - .5) * L * .05);
      }
    }
    ctx.globalAlpha = 1;
  },
};

/* ---------------------------------------------------------------- overlay */

function drawSeal(S, R) {
  const c = document.createElement('canvas');
  c.width = c.height = Math.ceil(S * 1.2);
  const x = c.getContext('2d'), m = S * .1;
  x.fillStyle = '#B4261B';
  x.beginPath();
  const N = 44;
  for (let i = 0; i < N; i++) {
    const t = i / N * 4, side = Math.floor(t), f = t - side, j = (R() - .5) * S * .022;
    const pt = side === 0 ? [m + f * S, m + j] : side === 1 ? [m + S + j, m + f * S] : side === 2 ? [m + S - f * S, m + S + j] : [m + j, m + S - f * S];
    i ? x.lineTo(pt[0], pt[1]) : x.moveTo(pt[0], pt[1]);
  }
  x.closePath(); x.fill();
  x.globalCompositeOperation = 'destination-out';
  x.fillStyle = '#000';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  const fs = S * .47;
  x.font = `${fs}px ${BRUSH_FONT}`;
  [...SEAL_TEXT].forEach((ch, i) => x.fillText(ch, m + S / 2, m + S * (.27 + .46 * i) + fs * .04));
  for (let i = 0; i < 70; i++) {
    x.globalAlpha = .5 + R() * .5;
    x.beginPath(); x.arc(m + R() * S, m + R() * S, S * (.004 + R() * R() * .022), 0, 7); x.fill();
  }
  for (let i = 0; i < 7; i++) {
    const e = Math.floor(R() * 4), f = R();
    const px = e === 0 ? f * S : e === 1 ? S : e === 2 ? f * S : 0, py = e === 0 ? 0 : e === 1 ? f * S : e === 2 ? S : f * S;
    x.globalAlpha = 1;
    x.beginPath(); x.arc(m + px, m + py, S * (.015 + R() * .03), 0, 7); x.fill();
  }
  return c;
}

function makeOverlay(W, H, P) {
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const u = Math.min(W, H) / 1000 * clamp(W / H, .62, 1.15) / 1.15 * 1.12;
  const S = P.season, R = mulberry32(P.seed * 7919 + 31 + P.si * 101);

  ctx.save();
  if (P.flip) { ctx.translate(W, 0); ctx.scale(-1, 1); }
  PLANTS[S.plant]({ ctx, W, H, u, R, ink: S.ink });
  ctx.restore();

  // inscription: columns read top-to-bottom, right-to-left
  const poem = S.poems[P.poem];
  const fs = Math.round(clamp(Math.min(H * .043, W * .036), 15, 400));
  const lh = fs * 1.13, gap = fs * 1.42, small = fs * .5;
  const margin = Math.max(fs * 1.9, W * .065);
  const textRight = !P.flip;
  const cols = 3, blockW = gap * (cols - 1);
  const xr = textRight ? W - margin : margin + blockW;
  const y0 = H * .095;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = S.text;
  const put = (ch, x, y, size, al) => {
    ctx.save();
    ctx.translate(x + (R() - .5) * size * .06, y);
    ctx.rotate((R() - .5) * .05);
    ctx.font = `${size * (.96 + R() * .08)}px ${BRUSH_FONT}`;
    ctx.globalAlpha = al;
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  };
  let bottom = y0;
  for (let c = 0; c < 2; c++) {
    [...poem[c]].forEach((ch, i) => {
      const y = y0 + lh * (i + .5) + (c ? lh * .0 : 0);
      put(ch, xr - gap * c, y, fs, .93);
      bottom = Math.max(bottom, y + lh * .5);
    });
  }
  const sx = xr - gap * 2 + fs * .12, sy0 = y0 + lh * 1.6;
  const sig = '\u5F55' + poem[2] + '\u53E5';
  [...sig].forEach((ch, i) => put(ch, sx, sy0 + small * 1.14 * (i + .5), small, .88));
  const sigEnd = sy0 + small * 1.14 * sig.length;
  const sealS = fs * 1.02;
  const sealC = drawSeal(sealS, R);
  const scx = sx, scy = sigEnd + small * .7 + sealS * .5;
  ctx.save();
  ctx.translate(scx, scy); ctx.rotate((R() - .5) * .06);
  ctx.globalAlpha = S.night ? .95 : .93;
  ctx.drawImage(sealC, -sealC.width / 2, -sealC.height / 2);
  ctx.restore();
  bottom = Math.max(bottom, scy + sealS * .7);

  const pad = fs * .8;
  const rect = (x0, y0_, x1, y1) => [x0 / W, 1 - y1 / H, x1 / W, 1 - y0_ / H];
  return {
    canvas: cv,
    textRect: rect(xr - blockW - pad, y0 - pad, xr + pad, bottom + pad),
    sealRect: rect(scx - sealS * .68, scy - sealS * .68, scx + sealS * .68, scy + sealS * .68),
    origin: S.plant === 'bamboo' ? [P.flip ? 1 : 0, 0] : [P.flip ? 1 : 0, 1],
  };
}

/* ---------------------------------------------------------------- gl */

const canvas = $('#c');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) { document.body.classList.add('nogl'); return; }

const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS = $('#frag').textContent;
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.bindAttribLocation(prog, 0, 'a');
gl.vertexAttribPointer(gl.getAttribLocation(prog, 'a'), 2, gl.FLOAT, false, 0, 0);
const U = {};
for (const n of ['uRes', 'uTime', 'uSeed', 'uScroll', 'uReveal', 'uMouse', 'uPaper', 'uMist', 'uSky', 'uInkFar', 'uInkNear',
  'uTintA', 'uTintB', 'uSunCol', 'uWaterCol', 'uSun', 'uStyle', 'uMode', 'uOverlay', 'uTextRect', 'uSealRect', 'uOvIn', 'uOvOrigin'])
  U[n] = gl.getUniformLocation(prog, n);
const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
gl.uniform1i(U.uOverlay, 0);

/* ---------------------------------------------------------------- state */

const q = new URLSearchParams(location.hash.slice(1));
const STILL = q.has('still');
const now0 = new Date();
function defaultSeason() {
  const m = now0.getMonth() + 1;
  return m >= 3 && m <= 5 ? 0 : m >= 6 && m <= 8 ? 1 : m >= 9 && m <= 11 ? 2 : 3;
}
const st = {
  seed: q.has('s') ? clamp(parseInt(q.get('s'), 10) || 0, 0, 9999) : Math.floor(Math.random() * 10000),
  si: q.has('m') ? clamp(parseInt(q.get('m'), 10) || 0, 0, 4) : defaultSeason(),
  scroll: 0, vel: 0, drag: null,
  mouse: [0, 0], mouseT: [0, 0],
  t0: performance.now(), born: 0, leaving: 0, next: null,
  scale: 1, P: null, ov: null, slow: 0,
};

function derive(seed, si) {
  const R = mulberry32(seed * 9973 + 17), S = SEASONS[si];
  const flip = R() < .5, sgn = flip ? -1 : 1;
  const P = { seed, si, season: S, flip };
  P.seedF = R() * 900;
  P.sunX = sgn * (.04 + R() * .2);
  P.sunY = .66 + R() * .15;
  P.sunR = .037 + R() * .02;
  P.water = R() < .82 ? .10 + R() * .09 : 0;
  P.birds = R() < .75 ? 3 + Math.floor(R() * 5) : 0;
  P.poem = Math.floor(R() * S.poems.length);
  if (S.night) { P.sunX = -sgn * (.12 + R() * .14); P.sunY = .70 + R() * .1; P.sunR = .05 + R() * .012; P.birds = 0; }
  if (S.snow) { P.birds = 0; P.sunR *= .85; }
  return P;
}

function viewSize() {
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  return [w, h];
}
function uploadOverlay(W, H) {
  placeSun(st.P, W / H);
  st.ov = makeOverlay(W, H, st.P);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, st.ov.canvas);
}
function overlayDims() {
  const [w, h] = viewSize(), d = Math.min(devicePixelRatio || 1, 2);
  const maxT = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), 4096);
  const k = Math.min(1, maxT / (w * d), maxT / (h * d));
  return [Math.max(2, Math.round(w * d * k)), Math.max(2, Math.round(h * d * k))];
}
function setPainting(seed, si) {
  st.seed = seed; st.si = si;
  st.P = derive(seed, si);
  uploadOverlay(...overlayDims());
  st.born = performance.now();
  syncUI();
}
function resize() {
  const [w, h] = viewSize(), d = Math.min(devicePixelRatio || 1, 2);
  let k = d * st.scale;
  const maxPx = 3.6e6;
  if (w * h * k * k > maxPx) k = Math.sqrt(maxPx / (w * h));
  const W = Math.max(2, Math.round(w * k)), H = Math.max(2, Math.round(h * k));
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
}

function setUniforms(W, H, time, reveal, ovIn) {
  const P = st.P, S = P.season, paper = hexRgb(S.paper);
  const rel = h => hexRgb(h).map((v, i) => Math.min(1.25, v / paper[i]));
  gl.viewport(0, 0, W, H);
  gl.uniform2f(U.uRes, W, H);
  gl.uniform1f(U.uTime, time);
  gl.uniform1f(U.uSeed, P.seedF);
  gl.uniform1f(U.uScroll, st.scroll);
  gl.uniform1f(U.uReveal, reveal);
  gl.uniform2f(U.uMouse, st.mouse[0], st.mouse[1]);
  gl.uniform3fv(U.uPaper, paper);
  gl.uniform3fv(U.uMist, rel(S.mist));
  gl.uniform3fv(U.uSky, rel(S.sky));
  gl.uniform3fv(U.uInkFar, rel(S.inkFar));
  gl.uniform3fv(U.uInkNear, rel(S.inkNear));
  gl.uniform3fv(U.uTintA, rel(S.tintA));
  gl.uniform3fv(U.uTintB, rel(S.tintB));
  gl.uniform3fv(U.uSunCol, rel(S.sun));
  gl.uniform3fv(U.uWaterCol, rel(S.water));
  const asp = W / H;
  gl.uniform4f(U.uSun, P.sunX * asp, P.sunYv, P.sunR, S.halo);
  gl.uniform4fv(U.uStyle, S.look);
  gl.uniform4f(U.uMode, S.snow, S.night, P.water, P.birds);
  gl.uniform4fv(U.uTextRect, st.ov.textRect);
  gl.uniform4fv(U.uSealRect, st.ov.sealRect);
  gl.uniform3fv(U.uOvIn, ovIn);
  gl.uniform2fv(U.uOvOrigin, st.ov.origin);
}

const T_OUT = 520;
function timeline(now) {
  if (STILL) return [1, [1, 1, 1]];
  const t = (now - st.born) / 1000;
  let reveal = ease(clamp(t / 3.4, 0, 1));
  const ov = [ease(clamp((t - 1.5) / 2.4, 0, 1)), clamp((t - 2.6) / 2.4, 0, 1), clamp((t - 5.15) / .12, 0, 1)];
  if (st.leaving) {
    const k = 1 - ease(clamp((now - st.leaving) / T_OUT, 0, 1));
    reveal *= k; ov[0] *= k; ov[1] *= k; ov[2] *= k;
  }
  return [reveal, ov];
}

let last = performance.now(), acc = 0, frames = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(.1, (now - last) / 1000);
  last = now;

  if (st.leaving && now - st.leaving >= T_OUT) {
    st.leaving = 0;
    setPainting(st.next[0], st.next[1]);
  }
  // handscroll: drift, drag, inertia
  if (!st.drag) {
    st.scroll += st.vel * dt;
    st.vel += ((STILL ? 0 : .0045) - st.vel) * Math.min(1, dt * 1.6);
  }
  st.mouse[0] += (st.mouseT[0] - st.mouse[0]) * Math.min(1, dt * 3);
  st.mouse[1] += (st.mouseT[1] - st.mouse[1]) * Math.min(1, dt * 3);

  resize();
  const [reveal, ov] = timeline(now);
  setUniforms(canvas.width, canvas.height, STILL ? 20 : (now - st.t0) / 1000, reveal, ov);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // adaptive resolution: stay fluid on modest GPUs
  acc += dt; frames++;
  if (acc > 1.5) {
    const ft = acc / frames;
    if (ft > .030 && st.scale > .45) { if (++st.slow >= 2) { st.scale *= .8; st.slow = 0; } }
    else st.slow = 0;
    acc = 0; frames = 0;
  }
  if (STILL) window.__ready = true;
}

/* ---------------------------------------------------------------- ui */

const ui = {
  root: $('#ui'), seasons: [...document.querySelectorAll('[data-season]')],
  vol: $('#vol'), style: $('#style'), next: $('#next'), save: $('#save'), hint: $('#hint'),
};
function syncUI() {
  const S = SEASONS[st.si];
  ui.seasons.forEach((b, i) => b.classList.toggle('on', i === st.si));
  ui.vol.textContent = '\u5377' + zhNum(st.seed);
  ui.style.textContent = S.style;
  document.body.classList.toggle('night', !!S.night);
  document.title = `\u5343\u5C71 \u00B7 \u5377${zhNum(st.seed)} \u00B7 ${S.style}`;
  try { history.replaceState(null, '', `#s=${st.seed}&m=${st.si}${STILL ? '&still' : ''}`); } catch (e) {}
}
function go(seed, si) {
  if (st.leaving) { st.next = [seed, si]; return; }
  st.next = [seed, si];
  st.leaving = performance.now();
  ui.hint.classList.add('gone');
}
const newSeed = () => Math.floor(Math.random() * 10000);
ui.seasons.forEach((b, i) => b.addEventListener('click', () => { if (i !== st.si) go(st.seed, i); }));
ui.next.addEventListener('click', () => go(newSeed(), st.si));
ui.save.addEventListener('click', savePng);

function savePng() {
  const [w, h] = viewSize();
  const maxT = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), 4096);
  const k = Math.min(3840 / Math.max(w, h), maxT / Math.max(w, h));
  const W = Math.round(w * k), H = Math.round(h * k);
  const keep = [canvas.width, canvas.height];
  canvas.width = W; canvas.height = H;
  uploadOverlay(W, H);
  setUniforms(W, H, (performance.now() - st.t0) / 1000, 1, [1, 1, 1]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const url = canvas.toDataURL('image/png');
  canvas.width = keep[0]; canvas.height = keep[1];
  uploadOverlay(...overlayDims());
  const a = document.createElement('a');
  a.href = url; a.download = `\u5343\u5C71-\u5377${String(st.seed).padStart(4, '0')}-${SEASONS[st.si].style}.png`;
  document.body.appendChild(a); a.click(); a.remove();
}

// pointer: drag to unroll, move for parallax
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  st.drag = { x: e.clientX, t: performance.now(), v: 0 };
  document.body.classList.add('dragging');
});
canvas.addEventListener('pointermove', e => {
  const [w, h] = viewSize();
  st.mouseT = [(e.clientX / w - .5) * 2, (e.clientY / h - .5) * -2];
  if (!st.drag) return;
  const now = performance.now(), dx = (e.clientX - st.drag.x) / h;
  st.scroll -= dx;
  const dtt = Math.max(1, now - st.drag.t) / 1000;
  st.drag.v = st.drag.v * .6 + (-dx / dtt) * .4;
  st.drag.x = e.clientX; st.drag.t = now;
  ui.hint.classList.add('gone');
});
const endDrag = () => {
  if (!st.drag) return;
  st.vel = performance.now() - st.drag.t < 80 ? clamp(st.drag.v, -3, 3) : 0;
  st.drag = null;
  document.body.classList.remove('dragging');
};
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('dblclick', () => go(newSeed(), st.si));
addEventListener('wheel', e => {
  e.preventDefault();
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  st.vel = clamp(st.vel + d * .0022, -3, 3);
  ui.hint.classList.add('gone');
}, { passive: false });
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'enter') { e.preventDefault(); go(newSeed(), st.si); }
  else if (k >= '1' && k <= '5') go(st.seed, +k - 1);
  else if (k === 's') savePng();
  else if (k === 'h') document.body.classList.toggle('bare');
  else if (k === 'arrowright') st.vel = clamp(st.vel + .5, -3, 3);
  else if (k === 'arrowleft') st.vel = clamp(st.vel - .5, -3, 3);
});

let idleTimer = 0;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 4200);
}
['pointermove', 'pointerdown', 'keydown', 'wheel'].forEach(n => addEventListener(n, wake, { passive: true }));
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => uploadOverlay(...overlayDims()), 180); });

/* ---------------------------------------------------------------- boot */

const fontsReady = document.fonts && document.fonts.load
  ? Promise.race([document.fonts.load(`40px ${BRUSH_FONT}`, SEAL_TEXT), new Promise(r => setTimeout(r, 2500))]).catch(() => {})
  : Promise.resolve();
fontsReady.then(() => {
  setPainting(st.seed, st.si);
  document.body.classList.add('ready');
  wake();
  requestAnimationFrame(frame);
});
})();

</script>
</body>
</html>
